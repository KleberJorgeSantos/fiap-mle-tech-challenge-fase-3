[project]
name = "triage-nlp"
version = "1.0.0"
description = "Automatic urgency triage of medical reports (NLP) with CI/CD, Airflow, Prometheus/Grafana and ONNX Runtime"
readme = "README.md"
requires-python = ">=3.11,<3.13"
authors = [{ name = "Kleber Jorge Santos" }]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "numpy>=1.26",
    "scikit-learn==1.5.2",
    "joblib>=1.4",
    "onnxruntime>=1.19",
    "prometheus-client>=0.20",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
train = [
    "pandas>=2.2",
    "skl2onnx>=1.17",
    "onnx>=1.16",
    "requests>=2.32",
    "truststore>=0.9",
    "mlflow-skinny>=3.0",
    "boto3>=1.34",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

# ── Ruff ─────────────────────────────────────────────────────────────────────

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["orchestration/logs"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

# ── Pytest / coverage ────────────────────────────────────────────────────────

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=src --cov-report=term-missing"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["src"]
omit = ["src/pipelines/train.py", "src/data/download.py"]

[tool.coverage.report]
show_missing = true
fail_under = 70

# ── uv ───────────────────────────────────────────────────────────────────────

[tool.uv]
# Use the OS trust store: works behind TLS-inspecting antivirus/proxies too.
native-tls = true
