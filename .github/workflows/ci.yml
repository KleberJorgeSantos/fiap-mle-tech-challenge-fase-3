name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  UV_VERSION: "0.7.12"
  IMAGE_NAME: triage-api

jobs:
  # ── 1. Code quality ─────────────────────────────────────────────────────────
  lint:
    name: Lint (ruff + cfn-lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - run: uv sync --frozen --extra dev
      - name: Ruff lint
        run: uv run ruff check src tests scripts dags
      - name: Ruff format check
        run: uv run ruff format --check src tests scripts dags
      - name: CloudFormation lint (infra as code)
        run: uv run cfn-lint infra/cloudformation.yml

  # ── 2. Unit tests (offline synthetic corpus, coverage gate 70%) ─────────────
  test:
    name: Tests (pytest)
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - run: uv sync --frozen --all-extras
      - name: Pytest + coverage
        run: uv run pytest --cov-report=xml
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

  # ── 3. Airflow DAG integrity ────────────────────────────────────────────────
  dag-check:
    name: Airflow DAG check
    needs: lint
    runs-on: ubuntu-latest
    env:
      AIRFLOW_VERSION: "2.10.5"
      AIRFLOW_HOME: ${{ github.workspace }}/.airflow
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install Airflow (official constraints) + training deps
        run: |
          pip install "apache-airflow==${AIRFLOW_VERSION}" \
            --constraint "https://raw.githubusercontent.com/apache/airflow/constraints-${AIRFLOW_VERSION}/constraints-${PYTHON_VERSION}.txt"
          pip install -r orchestration/requirements.txt pandas pyyaml pytest
      - name: Validate DAG
        run: |
          airflow db migrate
          pytest tests/test_dag.py -o addopts="" -v

  # ── 4. Train on the real corpus, build the image and smoke-test it ──────────
  build:
    name: Train + Docker build + smoke test
    needs: [test, dag-check]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - run: uv sync --frozen --all-extras

      - name: Train model (download -> validate -> train -> quality gate -> ONNX -> publish)
        run: uv run python -m src.pipelines.train

      - name: Latency benchmark (sklearn vs ONNX)
        run: |
          uv run python -m scripts.benchmark --n 500
          cat reports/latency.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: model-and-reports
          path: |
            models/
            reports/latency.*

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE_NAME }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test container
        run: |
          docker run -d --name api -p 8000:8000 ${{ env.IMAGE_NAME }}:ci
          for _ in $(seq 1 30); do curl -sf localhost:8000/health && break; sleep 2; done
          curl -sf localhost:8000/health | grep '"model_loaded":true'
          curl -sf -X POST localhost:8000/predict \
            -H 'Content-Type: application/json' \
            -d '{"text":"Acute myocardial infarction with ST elevation and chest pain"}' | tee /dev/stderr | grep '"label"'
          curl -sf localhost:8000/metrics | grep http_requests_total
          docker rm -f api
