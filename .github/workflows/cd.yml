name: CD

# Continuous delivery + deployment of the inference service.
#
# Triggers: CI succeeded on main · a new champion model was published by Airflow
# (repository_dispatch "model-published") · a release tag v* · manual run.
#
# With the AWS repository variables configured (see README, "Deploy na AWS"):
#   champion model from S3 -> image -> ECR (OIDC login) -> EC2 via SSM -> public smoke test
# Without them, it falls back to: train in CI -> image -> GHCR (no deploy).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  repository_dispatch:
    types: [model-published]
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: cd-deploy
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.11"
  UV_VERSION: "0.7.12"
  AWS_ENABLED: ${{ vars.AWS_ROLE_ARN != '' }}

jobs:
  # ── 1. Build the immutable image: code (commit) + approved model ──────────────
  build:
    name: Build image (code + champion model)
    # workflow_run fires on any CI conclusion: only deliver what CI approved.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # OIDC token for AWS
    outputs:
      image: ${{ steps.push.outputs.image }}
      sha: ${{ steps.vars.outputs.sha }}
      model_version: ${{ steps.model.outputs.version }}
    steps:
      - name: Resolve commit
        id: vars
        run: |
          SHA="${{ github.event.workflow_run.head_sha || github.sha }}"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "short=${SHA::7}" >> "$GITHUB_OUTPUT"

      # workflow_run runs in the context of the default branch: check out the exact commit CI tested.
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.vars.outputs.sha }}

      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - run: uv sync --frozen --all-extras

      - name: Configure AWS credentials (OIDC)
        if: env.AWS_ENABLED == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # The model that goes to production is the champion approved by the training
      # pipeline (Airflow -> quality gate -> ONNX parity -> S3). CI training is only a
      # fallback for the first run or for forks without AWS.
      - name: Get champion model
        id: model
        env:
          MODELS_BUCKET: ${{ vars.MODELS_BUCKET }}
        run: |
          CHAMPION="s3://${MODELS_BUCKET}/models/champion"
          if [ "$AWS_ENABLED" = "true" ] && aws s3 ls "$CHAMPION/metadata.json" >/dev/null 2>&1; then
            mkdir -p models
            aws s3 cp --recursive "$CHAMPION/" models/
            SOURCE="S3 champion ($CHAMPION)"
          else
            # MODELS_BUCKET must not leak into training: it would re-publish and re-trigger the CD.
            MODELS_BUCKET='' uv run python -m src.pipelines.train
            SOURCE="trained in CI (no champion in S3)"
          fi
          VERSION=$(uv run python -c "import json; print(json.load(open('models/metadata.json'))['model_version'])")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "### Modelo: \`$VERSION\` — $SOURCE" >> "$GITHUB_STEP_SUMMARY"

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: triage-api:candidate
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test before publishing
        run: |
          docker run -d --name api -p 8000:8000 triage-api:candidate
          for _ in $(seq 1 30); do curl -sf localhost:8000/health && break; sleep 2; done
          curl -sf localhost:8000/health | grep '"model_loaded":true'
          curl -sf -X POST localhost:8000/predict -H 'Content-Type: application/json' \
            -d '{"text":"Acute ischemic stroke with cerebral hemorrhage"}' | grep '"label"'
          docker rm -f api

      - name: Log in to Amazon ECR
        if: env.AWS_ENABLED == 'true'
        uses: aws-actions/amazon-ecr-login@v2

      - name: Log in to GHCR
        if: env.AWS_ENABLED != 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.AWS_ENABLED == 'true' && vars.ECR_REPOSITORY || format('ghcr.io/{0}', github.repository) }}
          tags: |
            type=raw,value=sha-${{ steps.vars.outputs.short }}-model-${{ steps.model.outputs.version }}
            type=raw,value=sha-${{ steps.vars.outputs.short }}
            type=semver,pattern={{version}}
            type=raw,value=latest

      - name: Push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

      - name: Export image reference
        id: push
        run: |
          IMAGE="${{ fromJSON(steps.meta.outputs.json).tags[0] }}"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "Imagem publicada: \`$IMAGE\`" >> "$GITHUB_STEP_SUMMARY"

  # ── 2. Deploy to EC2 (only when the AWS stack exists) ─────────────────────────
  deploy:
    name: Deploy to EC2 (SSM)
    needs: build
    if: vars.AWS_ROLE_ARN != '' && vars.EC2_INSTANCE_ID != ''
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.smoke.outputs.url }}
    permissions:
      contents: read
      id-token: write
    env:
      INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
      BUNDLE_URI: s3://${{ vars.MODELS_BUCKET }}/deploy/${{ needs.build.outputs.sha }}/
      API_IMAGE: ${{ needs.build.outputs.image }}
      AWS_REGION: ${{ vars.AWS_REGION }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.sha }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # The instance may have been stopped by the cost-saving schedule.
      - name: Ensure the instance is running and managed by SSM
        run: |
          STATE=$(aws ec2 describe-instances --instance-ids "$INSTANCE_ID" \
            --query 'Reservations[0].Instances[0].State.Name' --output text)
          echo "Instance state: $STATE"
          if [ "$STATE" = "stopped" ]; then
            aws ec2 start-instances --instance-ids "$INSTANCE_ID" >/dev/null
            aws ec2 wait instance-running --instance-ids "$INSTANCE_ID"
          fi
          for _ in $(seq 1 60); do
            PING=$(aws ssm describe-instance-information \
              --filters "Key=InstanceIds,Values=$INSTANCE_ID" \
              --query 'InstanceInformationList[0].PingStatus' --output text)
            [ "$PING" = "Online" ] && echo "SSM agent online" && exit 0
            sleep 5
          done
          echo "SSM agent did not come online" >&2; exit 1

      - name: Upload deploy bundle
        run: |
          mkdir -p bundle
          cp docker-compose.prod.yml scripts/ec2_deploy.sh bundle/
          cp -r nginx monitoring bundle/
          aws s3 sync --delete bundle/ "$BUNDLE_URI"

      - name: Deploy via SSM Run Command
        run: |
          jq -n --arg uri "$BUNDLE_URI" --arg img "$API_IMAGE" --arg region "$AWS_REGION" '{commands: [
            "set -euo pipefail",
            ("aws s3 cp " + $uri + "ec2_deploy.sh /tmp/ec2_deploy.sh"),
            ("API_IMAGE=" + $img + " AWS_REGION=" + $region + " BUNDLE_URI=" + $uri + " bash /tmp/ec2_deploy.sh")
          ]}' > params.json
          CMD_ID=$(aws ssm send-command --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript --comment "triage deploy ${GITHUB_SHA::7}" \
            --parameters file://params.json --query 'Command.CommandId' --output text)
          echo "SSM command: $CMD_ID"
          for _ in $(seq 1 120); do
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" \
              --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in Pending|InProgress|Delayed) sleep 5 ;; *) break ;; esac
          done
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query '[StandardOutputContent, StandardErrorContent]' --output text
          echo "Deploy status: $STATUS"
          [ "$STATUS" = "Success" ]

      - name: Public smoke test
        id: smoke
        run: |
          IP=$(aws ec2 describe-instances --instance-ids "$INSTANCE_ID" \
            --query 'Reservations[0].Instances[0].PublicIpAddress' --output text)
          URL="http://$IP"
          for _ in $(seq 1 20); do curl -sf "$URL/health" && break; sleep 3; done
          curl -sf "$URL/health" | grep '"model_loaded":true'
          curl -sf -X POST "$URL/predict" -H 'Content-Type: application/json' \
            -d '{"text":"Acute myocardial infarction with ST elevation"}' | grep '"label"'
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          {
            echo "### 🚀 Deploy concluído"
            echo "| | |"
            echo "|---|---|"
            echo "| Imagem | \`$API_IMAGE\` |"
            echo "| Modelo | \`${{ needs.build.outputs.model_version }}\` |"
            echo "| API | $URL/docs |"
            echo "| Grafana | $URL/grafana/ |"
            echo "| Prometheus | $URL/prometheus/ |"
          } >> "$GITHUB_STEP_SUMMARY"
