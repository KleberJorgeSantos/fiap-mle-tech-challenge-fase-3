# ============================================================
# Monitoring stack: API + Prometheus + Grafana
#
#   make train && docker compose up -d --build
#   API        http://localhost:8000/docs
#   Prometheus http://localhost:9090
#   Grafana    http://localhost:3000  (admin/admin, or anonymous viewer)
# ============================================================

services:
  api:
    build: .
    image: triage-api:latest
    container_name: triage-api
    ports:
      - "8000:8000"
    environment:
      MODEL_BACKEND: ${MODEL_BACKEND:-onnx}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      # Lets a model retrained by Airflow be picked up via POST /admin/reload.
      - ./models:/app/models:ro
    restart: unless-stopped
    networks: [monitoring]

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: triage-prometheus
    ports:
      - "9090:9090"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on: [api]
    restart: unless-stopped
    networks: [monitoring]

  grafana:
    image: grafana/grafana:11.2.0
    container_name: triage-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/triage_api.json
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on: [prometheus]
    restart: unless-stopped
    networks: [monitoring]

volumes:
  prometheus_data:
  grafana_data:

networks:
  monitoring:
