# ============================================================
# Serving + observability stack (local development), behind an nginx reverse proxy
#
#   make train && docker compose up -d --build
#
#   http://localhost/docs          API (Swagger)
#   http://localhost/grafana/      Grafana (anonymous viewer, or admin/admin)
#   http://localhost/prometheus/   Prometheus
#
# Direct ports (8000, 3000, 9090) are kept for local debugging. The cloud version
# of this stack is docker-compose.prod.yml (image from ECR, only port 80).
# Airflow + MLflow live in orchestration/docker-compose.yml.
# ============================================================

services:
  nginx:
    image: nginx:1.27-alpine
    container_name: triage-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on: [api, grafana, prometheus]
    restart: unless-stopped
    networks: [triage]

  api:
    build: .
    image: triage-api:latest
    container_name: triage-api
    ports:
      - "8000:8000"
    environment:
      MODEL_BACKEND: ${MODEL_BACKEND:-onnx}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      # Lets a model retrained by Airflow be picked up via POST /admin/reload.
      - ./models:/app/models:ro
    restart: unless-stopped
    networks: [triage]

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: triage-prometheus
    ports:
      - "9090:9090"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
      # Links in the UI carry the /prometheus/ prefix; nginx strips it before proxying.
      - --web.external-url=${PUBLIC_URL:-http://localhost}/prometheus/
      - --web.route-prefix=/
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on: [api]
    restart: unless-stopped
    networks: [triage]

  grafana:
    image: grafana/grafana:11.2.0
    container_name: triage-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s/grafana/"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/triage_api.json
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on: [prometheus]
    restart: unless-stopped
    networks: [triage]

volumes:
  prometheus_data:
  grafana_data:

networks:
  triage:
