# ============================================================
# Production stack on EC2: nginx + API + Prometheus + Grafana
#
# Deployed by the CD workflow (scripts/ec2_deploy.sh via SSM). Differences from the
# local docker-compose.yml:
#   * the API image comes from ECR and already contains the approved model
#     (immutable: rolling back = pointing API_IMAGE to an older tag)
#   * only nginx publishes a port (80); everything else stays on the Docker network
#   * values come from the .env written by the deploy script
# ============================================================

services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on: [api, grafana, prometheus]
    restart: unless-stopped
    networks: [triage]

  api:
    image: ${API_IMAGE:?API_IMAGE must point to the ECR image}
    environment:
      MODEL_BACKEND: onnx
      LOG_LEVEL: INFO
    restart: unless-stopped
    networks: [triage]

  prometheus:
    image: prom/prometheus:v2.54.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
      - --web.external-url=${PUBLIC_URL:-http://localhost}/prometheus/
      - --web.route-prefix=/
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on: [api]
    restart: unless-stopped
    networks: [triage]

  grafana:
    image: grafana/grafana:11.2.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD}
      GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s/grafana/"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/triage_api.json
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on: [prometheus]
    restart: unless-stopped
    networks: [triage]

volumes:
  prometheus_data:
  grafana_data:

networks:
  triage:
