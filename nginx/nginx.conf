# ============================================================
# Reverse proxy: single entry point (port 80) for the whole stack
#
#   /             -> FastAPI (API + Swagger at /docs)
#   /grafana/     -> Grafana
#   /prometheus/  -> Prometheus
# ============================================================

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - [$time_local] "$request" $status $body_bytes_sent '
                    'rt=$request_time urt=$upstream_response_time';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    sendfile          on;
    keepalive_timeout 65;
    server_tokens     off;

    # Reports are text: 1 MB is plenty and blocks abusive payloads at the edge.
    client_max_body_size 1m;

    # Shared proxy headers
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;

    upstream api {
        server api:8000;
        keepalive 32;   # reuse connections: avoids a TCP handshake per request
    }
    upstream grafana    { server grafana:3000; }
    upstream prometheus { server prometheus:9090; }

    server {
        listen 80;
        server_name _;

        # ── API (and Swagger at /docs) ────────────────────────
        location / {
            proxy_pass         http://api;
            proxy_set_header   Connection "";
            proxy_read_timeout 30s;
        }

        # Internal endpoints are never exposed through the public entry point:
        #   /metrics  -> scraped by Prometheus inside the Docker network
        #   /admin/*  -> model reload, called by the training platform on port 8000
        #                (locally) or not at all (on EC2, models ship inside the image)
        location = /metrics {
            return 404;
        }
        location /admin/ {
            return 404;
        }

        # ── Grafana ───────────────────────────────────────────
        # No trailing slash in proxy_pass: Grafana expects the full /grafana/... URI
        # (GF_SERVER_SERVE_FROM_SUB_PATH=true).
        location /grafana/ {
            proxy_pass         http://grafana;
            # WebSocket for Grafana Live
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_read_timeout 120s;
        }

        # ── Prometheus ────────────────────────────────────────
        # Trailing slash strips /prometheus/; --web.external-url builds correct links.
        location /prometheus/ {
            proxy_pass         http://prometheus/;
            proxy_read_timeout 60s;
        }
    }
}
