# ============================================================
# Local MLOps platform: Airflow (retraining) + MLflow (tracking/registry)
#
#   make mlops-up          # or: docker compose -f orchestration/docker-compose.yml up -d --build
#   Airflow UI: http://localhost:8080  (airflow / airflow)
#   MLflow UI:  http://localhost:5000
#
# Kept apart from the serving stack (../docker-compose.yml): it is heavy, runs on a
# schedule and never goes to the cloud. The project root is mounted at
# /opt/airflow/project, so the DAG reuses the code in src/ and publishes the model
# into ./models (local API) and, when configured, to S3 (cloud deploy).
# ============================================================

x-airflow-common: &airflow-common
  build: .
  image: triage-airflow:2.10.5
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
    AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/project/dags
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "false"
    AIRFLOW__SCHEDULER__DAG_DIR_LIST_INTERVAL: 30
    PYTHONPATH: /opt/airflow/project
    DATA_DIR: /opt/airflow/project/data
    MODEL_DIR: /opt/airflow/project/models
    REPORTS_DIR: /opt/airflow/project/reports
    MLFLOW_TRACKING_URI: http://mlflow:5000
    # Local API (serving stack) reloaded after a new model is published; soft-fail if it is down
    TRIAGE_API_URL: http://host.docker.internal:8000
    # Cloud delivery (optional, see README): publish the approved model to S3 and trigger the CD
    MODELS_BUCKET: ${MODELS_BUCKET:-}
    AWS_REGION: ${AWS_REGION:-us-east-1}
    AWS_PROFILE: ${AWS_PROFILE:-default}
    GITHUB_REPOSITORY: ${GITHUB_REPOSITORY:-}
    GITHUB_DISPATCH_TOKEN: ${GITHUB_DISPATCH_TOKEN:-}
  volumes:
    - ..:/opt/airflow/project
    - ./logs:/opt/airflow/logs
    # AWS credentials of your user (read-only). Defaults to an empty folder.
    - ${AWS_CONFIG_DIR:-./aws}:/home/airflow/.aws:ro
  user: "${AIRFLOW_UID:-50000}:0"
  extra_hosts:
    - "host.docker.internal:host-gateway"
  depends_on: &airflow-depends
    postgres:
      condition: service_healthy
    mlflow:
      condition: service_started

services:
  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.17.2
    container_name: triage-mlflow
    ports:
      - "5000:5000"
    command:
      - mlflow
      - server
      - --host=0.0.0.0
      - --port=5000
      - --backend-store-uri=sqlite:////mlflow/mlflow.db
      # Artifacts are uploaded through the server: clients need no shared filesystem.
      - --serve-artifacts
      - --artifacts-destination=/mlflow/artifacts
      # Host header check (MLflow 3): accept localhost, 127.0.0.1 and the "mlflow" service name.
      - --allowed-hosts=*
    volumes:
      - mlflow_data:/mlflow
    restart: unless-stopped

  postgres:
    image: postgres:13
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 10

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate &&
        airflow users create --username airflow --password airflow \
          --firstname Admin --lastname User --role Admin --email admin@example.com || true
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 15s
      retries: 10
    depends_on:
      <<: *airflow-depends
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      <<: *airflow-depends
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  airflow_pg:
  mlflow_data:
