# Prometheus scrape configuration (pull model: Prometheus polls /metrics)
global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: triage-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
